services:
  mongodb:
    image: mongo:8.0
    container_name: medilo-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - medilo_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  medilo_mongo_data:
